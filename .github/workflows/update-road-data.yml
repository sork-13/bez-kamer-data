# Каждую ночь заново скачивает камеры, посты и платные дороги по всей России
# из OpenStreetMap и сохраняет data/road-objects.json в репозиторий.
# Приложение забирает этот файл по адресу из EXPO_PUBLIC_ROAD_DATA_URL, например:
# https://cdn.jsdelivr.net/gh/<аккаунт>/<репозиторий>@main/data/road-objects.json
name: Обновление базы камер

on:
  schedule:
    - cron: '0 1 * * *' # 04:00 по Москве
  workflow_dispatch: # кнопка ручного запуска на GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Скачать данные OpenStreetMap
        run: node scripts/import-osm.mjs

      - name: Сохранить, если что-то изменилось
        run: |
          git config user.name "bez-kamer-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/road-objects.json
          git diff --cached --quiet && echo "Изменений нет" && exit 0
          git commit -m "Обновление базы камер $(date -u +%F)"
          git pull --rebase origin main
          git push

      - name: Сбросить кэш jsDelivr, чтобы телефоны сразу получили новую базу
        run: curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/data/road-objects.json"
